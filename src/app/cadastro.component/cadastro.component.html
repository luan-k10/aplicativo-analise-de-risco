<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/logo/logo-risco.png" alt="Logo Análise de Risco" />
    </div>

    <h1 class="auth-title">Novo usuário</h1>

    <form (ngSubmit)="cadastrar()" novalidate>
      <div class="input-with-icon">
        <span class="material-symbols-outlined">alternate_email</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="dados.email"
          placeholder="Email"
          autocomplete="email"
          aria-label="Email"
        />
      </div>

      <div class="input-with-icon">
        <span class="material-symbols-outlined">person</span>
        <input
          type="text"
          name="nome"
          [(ngModel)]="dados.nome"
          placeholder="Nome"
          autocomplete="name"
          aria-label="Nome"
        />
      </div>

      <div class="input-with-icon">
        <span class="material-symbols-outlined">badge</span>
        <input
          type="text"
          name="matricula"
          [(ngModel)]="dados.matricula"
          placeholder="Matrícula"
          autocomplete="username"
          aria-label="Matrícula"
        />
      </div>

      <div class="input-with-icon">
        <span class="material-symbols-outlined">lock</span>
        <input
          [type]="mostrarSenha() ? 'text' : 'password'"
          name="senha"
          [(ngModel)]="dados.senha"
          placeholder="Senha"
          autocomplete="new-password"
          aria-label="Senha"
        />
        <button
          type="button"
          class="icon-toggle"
          [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
          (click)="mostrarSenha.set(!mostrarSenha())"
        >
          <span class="material-symbols-outlined">{{
            mostrarSenha() ? 'visibility_off' : 'visibility'
          }}</span>
        </button>
      </div>

      <div class="input-with-icon">
        <span class="material-symbols-outlined">lock</span>
        <input
          [type]="mostrarSenha() ? 'text' : 'password'"
          name="confirmarSenha"
          [(ngModel)]="dados.confirmarSenha"
          placeholder="Confirmar senha"
          autocomplete="new-password"
          aria-label="Confirmar senha"
        />
      </div>

      @if (erro()) {
        <p class="msg-erro" role="alert">{{ erro() }}</p>
      }
      @if (sucesso()) {
        <p class="msg-sucesso">Cadastro realizado! Redirecionando para o login...</p>
      }

      <button type="submit" class="btn-primary" style="margin-top: 20px" [disabled]="sucesso()">
        Cadastrar
      </button>
    </form>

    <footer class="auth-footer">
      Já possui uma conta?
      <a routerLink="/login" class="link">Faça o login</a>
    </footer>
  </div>
</div>
