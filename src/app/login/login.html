<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/logo/logo-risco.png" alt="Logo Análise de Risco" />
    </div>

    <form (ngSubmit)="entrar()" novalidate>
      <div class="input-with-icon">
        <span class="material-symbols-outlined">badge</span>
        <input
          type="text"
          name="matricula"
          [(ngModel)]="matricula"
          placeholder="Digite sua matrícula"
          autocomplete="username"
          aria-label="Matrícula"
        />
      </div>

      <div class="input-with-icon">
        <span class="material-symbols-outlined">lock</span>
        <input
          [type]="mostrarSenha() ? 'text' : 'password'"
          name="senha"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          aria-label="Senha"
        />
        <button
          type="button"
          class="icon-toggle"
          [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
          (click)="mostrarSenha.set(!mostrarSenha())"
        >
          <span class="material-symbols-outlined">{{
            mostrarSenha() ? 'visibility_off' : 'visibility'
          }}</span>
        </button>
      </div>

      <div class="esqueceu">
        <button type="button" class="link-suave" (click)="esqueceuSenha()">
          Esqueceu a senha?
        </button>
      </div>

      @if (erro()) {
        <p class="msg-erro" role="alert">{{ erro() }}</p>
      }
      @if (info()) {
        <p class="msg-info">{{ info() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="enviando()">Entrar</button>

      <div class="divisor"><span>OU</span></div>

      <button type="button" class="btn-outlook" (click)="entrarComOutlook()">
        <svg class="outlook-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="4" width="13" height="16" rx="1.5" fill="#28a8ea" />
          <path d="M9 9l6.5 4L22 9" fill="none" stroke="#fff" stroke-width="1.4" />
          <rect x="2" y="6" width="11" height="12" rx="1.5" fill="#0078d4" />
          <ellipse
            cx="7.5"
            cy="12"
            rx="2.6"
            ry="3.2"
            fill="none"
            stroke="#fff"
            stroke-width="1.6"
          />
        </svg>
        Entrar com outlook
      </button>
    </form>

    <footer class="auth-footer">
      Ainda não possui uma conta?
      <a routerLink="/cadastro" class="link">Cadastre-se</a>
    </footer>
  </div>
</div>
