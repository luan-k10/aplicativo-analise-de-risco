<div class="page-background">
  <div class="login-card">

    <header class="login-header">
      <div class="logo-container">
        <div class="risco-logo">Risco</div>
      </div>
    </header>

    <main class="login-form-container">
      <form class="login-form">

        <div class="input-with-icon">
          <span class="material-symbols-outlined icon">login</span>
          <input type="text" id="matricula" placeholder="Digite sua matrícula">
        </div>

        <div class="password-field-group">
          <div class="input-with-icon">
            <span class="material-symbols-outlined icon">lock</span>
            <input type="password" id="password" placeholder="Digite sua senha">
          </div>
          <div class="forgot-password-container">
            <a href="#" class="forgot-password-link">Esqueceu a senha?</a>
          </div>
        </div>

        <button type="button" (click)="fazerLogin()" class="btn-primary-login">Entrar</button>

      </form>
    </main>

    <footer class="login-footer">
      <p>Ainda não possui uma conta? <a routerLink="/cadastro" class="register-link">Cadastre-se</a></p>
    </footer>

  </div>
</div>
